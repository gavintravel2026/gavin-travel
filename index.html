const loadDays=()=>{try{return JSON.parse(localStorage.getItem(storageKey))||structuredClone(seed.days)}catch{return structuredClone(seed.days)}};
const saveDays=()=>localStorage.setItem(storageKey,JSON.stringify(days));
const icon=item=>/空港|Peach|Jetstar|flight/i.test(item.title+' '+item.typeHint)?'✈️':/高鐵|台鐵|自強|train|rail/i.test(item.title+' '+item.typeHint)?'🚆':/客運|bus/i.test(item.title)?'🚌':/ホテル|チェックイン|lodging/i.test(item.title+' '+item.typeHint)?'🏨':/豆漿|小籠|飯|麵|夜市|市場|food|restaurant/i.test(item.title+' '+item.typeHint)?'🍜':'🏛️';
const foodEmoji=name=>/豆漿/.test(name)?'🥛':/小籠|湯包|水餃/.test(name)?'🥟':/豆花|冰/.test(name)?'🍧':/鵝|雞/.test(name)?'🍗':/牛肉/.test(name)?'🍜':'🍚';
async function init(){seed=JSON.parse(document.querySelector('#seedData').textContent);days=loadDays();selectedDay=localStorage.getItem('gavin-active-day')||days[0].id;bindGlobal();onAuthStateChanged(auth,u=>{user=u;render()});render();}
function bindGlobal(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.route));document.querySelector('#aiFab').onclick=()=>go('concierge');window.addEventListener('online',network);window.addEventListener('offline',network);network();let drag=false,dx=0,dy=0;const fab=document.querySelector('#aiFab');fab.addEventListener('pointerdown',e=>{drag=true;dx=e.clientX-fab.offsetLeft;dy=e.clientY-fab.offsetTop;fab.setPointerCapture(e.pointerId)});fab.addEventListener('pointermove',e=>{if(!drag)return;fab.style.left=Math.max(8,Math.min(innerWidth-67,e.clientX-dx))+'px';fab.style.top=Math.max(80,Math.min(innerHeight-150,e.clientY-dy))+'px';fab.style.right='auto';fab.style.bottom='auto'});fab.addEventListener('pointerup',()=>drag=false);form.addEventListener('submit',e=>{e.preventDefault();const item={...editing,timeLabel:document.querySelector('#editTime').value.trim()||'時間未定',title:document.querySelector('#editName').value.trim(),description:document.querySelector('#editDescription').value.trim()};const day=days.find(d=>d.id===selectedDay);undo=structuredClone(days);const index=day.items.findIndex(i=>i.id===item.id);if(index>=0)day.items[index]=item;else day.items.push(item);saveDays();editor.close();editing=null;render()})}
function network(){document.querySelector('#offline').hidden=navigator.onLine}
function go(next){route=next;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));scrollTo({top:0,behavior:'smooth'});render()}
function account(){return user?`<button class="avatar" id="logout" title="ログアウト">${user.photoURL?`<img src="${esc(user.photoURL)}" alt="">`:esc(user.displayName?.[0]||'G')}</button>`:`<button class="account" id="login">ログイン</button>`}
function header(title,caption='台湾2026',plus=false){return `<header class="page-head"><div><div class="caption">${esc(caption)}</div><h1>${esc(title)}</h1></div>${plus?'<button class="icon" id="add">＋</button>':account()}</header>`}
function render(){if(!seed)return;app.innerHTML=route==='home'?home():route==='itinerary'?itinerary():route==='gourmet'?gourmet():route==='map'?map():concierge();bindScreen()}
function home(){const count=days.reduce((n,d)=>n+d.items.length,0);return `<header class="brand"><div><h1>Gavin Travel</h1><small>台湾旅行サポート</small></div>${account()}</header><section class="welcome card"><div><h2>おはようございます！</h2><p>今日も素敵な旅を楽しみましょう</p></div><div class="weather">☀️ <b>31℃</b><span>台北市</span></div></section><button class="trip card" data-go="itinerary"><div class="trip-photo">🇹🇼</div><div><span class="eyebrow">今回の旅</span><h2>台湾旅行 2026</h2><strong>8/6（木）〜8/13（木）</strong><p>台北・台中・南投・台南・宜蘭</p><div class="stats"><span>🍜 ${seed.restaurants.length}店</span><span>📍 ${count}件</span><span>📷 写真</span></div></div></button><button class="next card" data-go="itinerary"><span>次の予定</span><strong>10:30　審計新村・草悟道エリア散策</strong><b>旅程を開く ›</b></button><section class="shortcuts card">${[['▤','旅程','itinerary'],['⌖','マップ','map'],['♨','グルメ','gourmet'],['▣','写真','home'],['✦','AIコンシェルジュ','concierge']].map(x=>`<button data-go="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</section><div class="section-title"><h2>今日のおすすめ</h2><span>横にスワイプ</span></div><div class="horizontal">${[['🥟','杭州小籠湯包','混雑前の早めの時間がおすすめです。'],['🍧','幸發亭冰店','台中散策の途中に休憩を入れます。'],['🍜','阿村牛肉湯','台南で外せない朝の一杯です。']].map(x=>`<article class="recommend card"><div class="photo">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div><div class="section-title"><h2>旅のハイライト</h2><span>3件表示</span></div><div class="highlights">${[['🏮','雙城街夜市'],['🚤','日月潭'],['🏘️','審計新村']].map(x=>`<article class="card"><div class="photo">${x[0]}</div><strong>${x[1]}</strong></article>`).join('')}</div>`}
function itinerary(){const day=days.find(d=>d.id===selectedDay)||days[0];return `${header('旅程','台湾2026',true)}<div class="date-tabs">${days.map(d=>{const dt=new Date(d.date+'T12:00:00');return `<button data-day="${d.id}" class="${d.id===day.id?'active':''}"><span>${dt.toLocaleDateString('ja-JP',{weekday:'short'})}</span><strong>${dt.getMonth()+1}/${dt.getDate()}</strong></button>`}).join('')}</div><section class="day card"><div class="caption">${esc(day.dateLabel)}</div><h2>${esc(day.title)}</h2><p class="caption">${day.stayLabel?'宿泊：'+esc(day.stayLabel):'宿泊なし'}</p></section><div class="toolbar"><span>変更は自動保存</span><button id="undo" ${undo?'':'disabled'}>元に戻す</button><button id="reset">初期状態</button></div><section class="timeline">${day.items.map((item,index)=>`<article class="item"><div class="dot">${icon(item)}</div><div class="item-card card"><button class="item-main" data-edit="${item.id}"><div class="time">${esc(item.timeLabel||'時間未定')} ${item.locked?'🔒':''}</div><h3>${esc(item.title)}</h3>${item.description?`<p>${esc(item.description)}</p>`:''}</button><div class="actions"><button data-move="${item.id}" data-delta="-1" ${index===0?'disabled':''}>↑</button><button data-move="${item.id}" data-delta="1" ${index===day.items.length-1?'disabled':''}>↓</button><button data-delete="${item.id}">削除</button></div></div></article>`).join('')}</section>`}
function gourmet(){let restaurants=[...seed.restaurants];if(gourmetMode==='rating')restaurants.sort((a,b)=>(b.googleRating||0)-(a.googleRating||0));if(gourmetMode==='code')restaurants.sort((a,b)=>a.code.localeCompare(b.code));return `${header('グルメ')}<div class="filter"><button data-filter="all" class="${gourmetMode==='all'?'active':''}">おすすめ</button><button data-filter="rating" class="${gourmetMode==='rating'?'active':''}">評価順</button><button data-filter="code" class="${gourmetMode==='code'?'active':''}">T番号順</button></div><section class="gourmet-list">${restaurants.map(r=>`<article class="restaurant card"><div class="food-photo">${foodEmoji(r.name)}</div><div><h2>${esc(r.name)}</h2><p>⭐ ${r.googleRating??'—'}　${r.googleReviewCountApprox?Number(r.googleReviewCountApprox).toLocaleString()+'件':''}</p><p>${esc(r.recommendedMenuText||'おすすめメニュー確認中')}</p><div class="tags"><span class="tag">${esc(r.code)}</span><span class="tag">${esc(r.budgetText||'予算未登録')}</span></div></div></article>`).join('')}</section>`}
function map(){return `${header('マップ')}<section class="map card"><div class="grid"></div>${[['🍜','20%','25%'],['🏨','66%','19%'],['🚆','43%','58%'],['📍','72%','67%']].map(x=>`<div class="pin" style="left:${x[1]};top:${x[2]}"><span>${x[0]}</span></div>`).join('')}<div class="map-info card"><strong>台湾2026の予定</strong><p class="caption">実装版では各予定の緯度・経度を使い、地図上に表示します。</p><button class="primary" onclick="window.open('https://www.google.com/maps','_blank')">Googleマップを開く</button></div></section>`}
function concierge(){return `${header('AIコンシェルジュ')}<section class="concierge"><article class="intro card"><h2>こんにちは、Gavinさん！</h2><p>台湾旅行のお手伝いをします 🇹🇼</p><strong>旅行期間：2026/8/6〜8/13</strong></article><div class="horizontal">${['今日の旅程を確認','おすすめグルメ','交通・移動','雨の日の候補'].map(q=>`<button class="quick" data-question="${q}">${q}</button>`).join('')}</div><article class="chat card"><div id="messages">${messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><form class="composer" id="chatForm"><input id="chatInput" placeholder="質問を入力してください…"><button class="primary">送信</button></form></article></section>`}
function bindScreen(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelector('#login')?.addEventListener('click',()=>signInWithRedirect(auth,new GoogleAuthProvider()));document.querySelector('#logout')?.addEventListener('click',()=>signOut(auth));if(route==='itinerary'){document.querySelector('#add').onclick=()=>openEditor();document.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>{selectedDay=e.dataset.day;localStorage.setItem('gavin-active-day',selectedDay);render()});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openEditor(e.dataset.edit));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{if(!confirm('この予定を削除しますか？'))return;undo=structuredClone(days);const d=days.find(x=>x.id===selectedDay);d.items=d.items.filter(i=>i.id!==e.dataset.delete);saveDays();render()});document.querySelectorAll('[data-move]').forEach(e=>e.onclick=()=>move(e.dataset.move,Number(e.dataset.delta)));document.querySelector('#undo').onclick=()=>{if(!undo)return;const current=structuredClone(days);days=undo;undo=current;saveDays();render()};document.querySelector('#reset').onclick=()=>{if(!confirm('台湾2026の初期データに戻しますか？'))return;undo=structuredClone(days);days=structuredClone(seed.days);saveDays();render()}}if(route==='gourmet')document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{gourmetMode=e.dataset.filter;render()});if(route==='concierge'){document.querySelectorAll('[data-question]').forEach(e=>e.onclick=()=>ask(e.dataset.question));document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#chatInput');if(input.value.trim())ask(input.value.trim())}}}
function openEditor(id){const day=days.find(d=>d.id===selectedDay);editing=id?day.items.find(i=>i.id===id):{id:crypto.randomUUID(),order:day.items.length+1,date:day.date,timeLabel:'時間未定',startTime:null,endTime:null,approximate:true,timeKind:'manual',title:'',description:'',typeHint:'other',restaurantCode:null,links:{},locked:false,source:'app'};document.querySelector('#editorTitle').textContent=id?'予定を編集':'予定を追加';document.querySelector('#editTime').value=editing.timeLabel;document.querySelector('#editName').value=editing.title;document.querySelector('#editDescription').value=editing.description;editor.showModal()}
function move(id,delta){const day=days.find(d=>d.id===selectedDay),index=day.items.findIndex(i=>i.id===id),target=index+delta;if(target<0||target>=day.items.length)return;undo=structuredClone(days);[day.items[index],day.items[target]]=[day.items[target],day.items[index]];day.items.forEach((i,n)=>i.order=n+1);saveDays();render()}
function ask(text){messages.push({role:'user',text});let reply=/旅程/.test(text)?'旅程タブから日付を選ぶと、その日の予定を確認・編集できます。':/グルメ/.test(text)?'登録済み20店をグルメタブで確認できます。台湾2026のT番号も表示しています。':/交通/.test(text)?'移動時刻は旅行直前に公式ダイヤで再確認する設計です。':/雨/.test(text)?'雨の日は屋内の食事、地下街、駅周辺を優先する候補を出します。':'内容を確認しました。現在の試作版では台湾2026の登録データを基に回答します。';messages.push({role:'ai',text:reply});render()}
init().catch(error=>{app.innerHTML=`<section class="card" style="padding:20px"><h1>読み込みエラー</h1><p>${esc(error.message)}</p></section>`});

</script>
</body>
</html>
